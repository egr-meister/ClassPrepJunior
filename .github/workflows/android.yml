name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAVA_VERSION: "17"
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Uses the Android SDK preinstalled on the GitHub runner (ANDROID_HOME).
      - name: Install SDK Platform 36 and Build-Tools 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle (uses the committed wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests and release lint
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease

      - name: Decode PKCS12 keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          KS_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$KS_DIR" && chmod 700 "$KS_DIR"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS_DIR/release.p12"
          chmod 600 "$KS_DIR/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$KS_DIR/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK signature (must not be a debug certificate)
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          if grep -q "CN=Android Debug" apksigner.txt; then echo "::error::APK is signed with a debug certificate"; exit 1; fi
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt

      - name: Verify AAB signature and signer identity
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          # The upload certificate is self-signed by design; jarsigner's "self-signed" notice is expected.
          jarsigner -verify -verbose -certs "$AAB" > jarsigner.txt 2>&1 || { cat jarsigner.txt; exit 1; }
          grep -q "jar verified." jarsigner.txt
          if grep -q "CN=Android Debug" jarsigner.txt; then echo "::error::AAB signed with a debug certificate"; exit 1; fi
          # Signer identity: the AAB certificate must match the release keystore certificate.
          EXPECTED="$(keytool -list -v -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^\s*SHA256: //p' | head -1)"
          unzip -p "$AAB" 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 2>/dev/null > sig.p7b || true
          ACTUAL="$(keytool -printcert -file sig.p7b | sed -n 's/^\s*SHA256: //p' | head -1)"
          echo "Expected signer SHA-256: $EXPECTED"; echo "AAB signer SHA-256:      $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL"

      - name: Check release permission allowlist
        run: scripts/check_permissions.sh app/build/outputs/apk/release/app-release.apk

      - name: Native library / 16 KB alignment check
        run: scripts/check_16kb.sh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classprep-junior-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/signing" sig.p7b
